<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f4f2ef">
  <title>Medifé · Portal comercial</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/v2.css">
  <link rel="stylesheet" href="css/logo-fix.css">
  <link rel="stylesheet" href="css/login-v3.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-brand">
      <a class="login-official-logo" href="login.html" aria-label="Medifé">
        <img src="https://cdn.brandfetch.io/id6jmCuFs2/theme/dark/logo.svg?c=1bxid64Mup7aczewSAYMX&t=1781726803816" crossorigin="anonymous" referrerpolicy="no-referrer" alt="Medifé">
      </a>
      <div class="login-copy">
        <p class="eyebrow">PORTAL COMERCIAL</p>
        <h1>Cotizador<br>Medifé.</h1>
        <p>Planes, aportes y promociones en una sola herramienta para el equipo comercial.</p>
      </div>
      <p class="zeroka">UNA HERRAMIENTA DE <b>GRUPO ZEROKA</b></p>
    </section>
    <section class="login-card">
      <p class="eyebrow">ACCESO</p>
      <h2>Ingresá al cotizador</h2>
      <p class="muted">Usá tus credenciales comerciales.</p>
      <form id="loginForm" autocomplete="on">
        <label>Usuario<input name="username" autocomplete="username" required></label>
        <label>Contraseña<span class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" id="showPassword">Ver</button></span></label>
        <p class="form-error" id="loginError" role="alert"></p>
        <button class="button button--primary button--wide" type="submit"><span>Ingresar</span><span>→</span></button>
      </form>
      <p class="login-note">Grupo Zeroka · uso interno comercial.</p>
    </section>
  </main>
  <script src="auth/login.js"></script>
</body>
</html>
